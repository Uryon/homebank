# Configuration SonarQube/SonarCloud pour le mono-repo Homebank (backend
# Java/Spring Boot + frontend Vue). Utilise avec le sonar-scanner CLI :
#   sonar-scanner -Dsonar.host.url=<url> -Dsonar.token=<token>
# (host/token volontairement absents d'ici : a fournir en ligne de commande,
# variable d'environnement, ou configuration du serveur CI, jamais en dur).

sonar.projectKey=homebank
sonar.projectName=Homebank
sonar.sourceEncoding=UTF-8

# Sources et tests par module (chemins relatifs a la racine du repo).
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.exclusions=frontend/dist/**,frontend/node_modules/**,export/sortie/**,export/node_modules/**

# Java : classes compilees necessaires pour une analyse complete
# (bytecode requis par certaines regles) et version du JDK.
sonar.java.binaries=backend/target/classes
sonar.java.source=21

# Couverture de tests (genere par le plugin jacoco-maven-plugin lors de
# `mvn test`, voir backend/pom.xml) : necessite d'avoir lance les tests
# avant le scan pour que ce fichier existe.
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Vue : les fichiers .vue sont analyses comme du JS/TS via le moteur JS de Sonar.
sonar.javascript.file.suffixes=.js,.vue
