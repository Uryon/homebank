spring.application.name=homebank

# --- Base de donnees : H2 en memoire, isolee de la vraie base PostgreSQL ---
# Base en memoire : vierge a chaque demarrage, schema cree par Flyway, rempli
# ensuite par TestDataSeeder (voir config/TestDataSeeder.java) avec des donnees de
# demonstration. Aucune donnee reelle n'est jamais lue ni modifiee ici.
spring.datasource.url=jdbc:h2:mem:homebank_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Schema cree par les scripts Flyway (comme en reel), puis verifie par
# Hibernate : les tests d'integration echouent si un script et les entites
# divergent.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 accessible sur http://localhost:8080/h2-console (pratique pour
# inspecter les donnees de test directement ; JDBC URL = celle ci-dessus).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

# Sauvegardes du profil test (donnees de demonstration) : jamais dans le
# dossier synchronise de la vraie appli.
sauvegarde.dossier=${java.io.tmpdir}/homebank-test-sauvegardes
