spring.application.name=homebank

# --- Base de donnees PostgreSQL ---
# Adapte l'URL, l'utilisateur et le mot de passe a ton environnement,
# ou surcharge-les via variables d'environnement (voir README).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homebank}
spring.datasource.username=${DB_USER:homebank}
spring.datasource.password=${DB_PASSWORD:homebank}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Schema de la base : Flyway ---
# Le schema est decrit par les scripts versionnes de src/main/resources/db/migration
# (V1__schema_initial.sql, puis V2__..., V3__... pour chaque evolution), appliques
# dans l'ordre au demarrage et traces dans la table flyway_schema_history.
# Une base deja remplie sans cette table (schema cree autrefois par Hibernate)
# est enregistree directement en version 1, sans rien executer : ses donnees ne
# sont pas touchees.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- JPA / Hibernate ---
# 'validate' : Hibernate verifie au demarrage que le schema correspond aux
# entites, sans jamais le modifier (une colonne ajoutee a une entite demande
# donc un nouveau script Flyway). Repli d'urgence si la verification bloque le
# demarrage : variable d'environnement JPA_DDL_AUTO=update (ancien comportement).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Ecritures envoyees par paquets : valider ou supprimer des milliers de lignes
# ne coute plus un aller-retour avec la base par ligne.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_updates=true
# Pas de session Hibernate ouverte pendant toute la requete HTTP : les services
# convertissent leurs entites en DTO a l'interieur de leur propre transaction
# (@Transactional), et les mappers appeles depuis les controllers ne lisent que
# des ids de relations (disponibles sans charger l'entite liee). Une connexion
# n'est donc plus retenue le temps d'ecrire la reponse JSON.
spring.jpa.open-in-view=false

# --- Logs ---
# Niveau INFO par defaut sur tout le code applicatif ; les erreurs 500
# (voir GlobalExceptionHandler) sont loggees avec leur stacktrace complete
# en niveau ERROR, donc toujours visibles meme sans toucher a cette config.
logging.level.com.homebank=INFO
# Repasser a DEBUG temporairement si besoin de voir le detail des requetes SQL
# fautives lors du diagnostic d'une 500 :
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE


# --- Upload de fichiers (import CSV/QIF) ---
# Un CSV/QIF bancaire tient tres largement dans cette limite : environ une
# ligne par transaction (~100-150 octets), donc meme plusieurs milliers de
# transactions en un seul import restent sous 1 Mo. 8 Mo (au lieu de 10)
# pour rester sous le seuil par defaut de la regle Sonar correspondante,
# sans que ca ne change rien en pratique.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

server.port=8080
# Ecoute sur la boucle locale uniquement : l'API n'a pas d'authentification
# et expose toutes les donnees bancaires ; sans cette ligne, n'importe quel
# appareil du meme reseau (Wi-Fi) pouvait les lire et les modifier. Le
# frontend (proxy Vite), le lanceur et l'export passent tous par 127.0.0.1.
# SERVER_ADDRESS=0.0.0.0 pour un acces volontaire depuis le reseau.
server.address=${SERVER_ADDRESS:127.0.0.1}

# --- Export PDF du tableau de bord (voir ServiceExport) ---
# Dossier de sortie : par defaut export/sortie/ a la racine du projet
# ("../export/sortie" depuis le repertoire de travail backend/, cas standard
# mvn/IntelliJ) — dossier dedie ne contenant que les PDF generes, a synchroniser
# via Google Drive pour ordinateur pour consultation a distance (telephone,
# autre PC) pendant que le PC reste allume (le dossier export/ parent contient
# aussi le script Node/Playwright et node_modules, qu'on ne veut pas y voir).
# Surcharger via EXPORT_DOSSIER_SORTIE si besoin d'un autre dossier.
export.dossier-sortie=${EXPORT_DOSSIER_SORTIE:../export/sortie}
# URL du tableau de bord a capturer (serveur de dev Vite par defaut). Le
# tableau de bord est la route racine du frontend (voir frontend/src/router/index.js,
# path: '/', name: 'dashboard') — surtout ne pas mettre "/dashboard" ici, la
# route n'existe pas et RouterView reste vide (seule la sidebar s'affiche).
# 127.0.0.1 plutot que localhost : Vite n'ecoute qu'en IPv4 (voir
# frontend/vite.preview.config.mjs) et localhost essayait d'abord IPv6 (::1)
# a chaque connexion : chargement de la page 0,9 s plus long (mesure).
export.url-tableau-de-bord=${EXPORT_URL_TABLEAU_DE_BORD:http://127.0.0.1:5173/}
# Chemin (absolu ou relatif au repertoire de travail du process backend) du
# script Node/Playwright. Par defaut, suppose que le backend est lance depuis
# le dossier backend/ (cas standard mvn/IntelliJ) : ../export/export-dashboard.mjs.
# A adapter via la variable d'environnement si le repertoire de travail differe.
export.chemin-script=${EXPORT_CHEMIN_SCRIPT:../export/export-dashboard.mjs}
# Executable Node utilise pour lancer ce script : par defaut "node", resolu
# via le PATH systeme (portable, comportement historique). A epingler a un
# chemin absolu via EXPORT_CHEMIN_NODE si on veut eliminer toute dependance
# au PATH (ex : environnement partage ou le PATH n'est pas totalement de confiance).
export.chemin-node=${EXPORT_CHEMIN_NODE:node}
# Duree maximale (secondes) laissee au script d'export avant arret force
# (script Node et navigateur Playwright compris).
export.delai-max-secondes=${EXPORT_DELAI_MAX_SECONDES:30}

# --- Sauvegarde des donnees (voir ServiceSauvegarde) ---
# Une sauvegarde complete (JSON) est ecrite au premier demarrage de chaque jour
# dans ce dossier, par defaut sous le dossier d'export synchronise (Google
# Drive) pour qu'une copie existe hors de cet ordinateur ; les plus anciennes
# au-dela de sauvegarde.conserver sont supprimees. Contient TOUTES les donnees
# bancaires : choisir un dossier prive. SAUVEGARDE_AUTOMATIQUE=false la desactive.
sauvegarde.dossier=${SAUVEGARDE_DOSSIER:${export.dossier-sortie}/sauvegardes}
sauvegarde.conserver=${SAUVEGARDE_CONSERVER:30}
sauvegarde.automatique=${SAUVEGARDE_AUTOMATIQUE:true}
