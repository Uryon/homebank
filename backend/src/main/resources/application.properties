spring.application.name=homebank

# --- Base de donnees PostgreSQL ---
# Adapte l'URL, l'utilisateur et le mot de passe a ton environnement,
# ou surcharge-les via variables d'environnement (voir README).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homebank}
spring.datasource.username=${DB_USER:homebank}
spring.datasource.password=${DB_PASSWORD:homebank}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' cree/adapte automatiquement le schema au demarrage (pratique en dev).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Logs ---
# Niveau INFO par defaut sur tout le code applicatif ; les erreurs 500
# (voir GlobalExceptionHandler) sont loggees avec leur stacktrace complete
# en niveau ERROR, donc toujours visibles meme sans toucher a cette config.
logging.level.com.homebank=INFO
# Repasser a DEBUG temporairement si besoin de voir le detail des requetes SQL
# fautives lors du diagnostic d'une 500 :
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE


# --- Upload de fichiers (import CSV/QIF) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

# --- Export PDF du tableau de bord (voir ServiceExport) ---
# Dossier de sortie : par defaut export/sortie/ a la racine du projet
# ("../export/sortie" depuis le repertoire de travail backend/, cas standard
# mvn/IntelliJ) — dossier dedie ne contenant que les PDF generes, a synchroniser
# via Google Drive pour ordinateur pour consultation a distance (telephone,
# autre PC) pendant que le PC reste allume (le dossier export/ parent contient
# aussi le script Node/Playwright et node_modules, qu'on ne veut pas y voir).
# Surcharger via EXPORT_DOSSIER_SORTIE si besoin d'un autre dossier.
export.dossier-sortie=${EXPORT_DOSSIER_SORTIE:../export/sortie}
# URL du tableau de bord a capturer (serveur de dev Vite par defaut). Le
# tableau de bord est la route racine du frontend (voir frontend/src/router/index.js,
# path: '/', name: 'dashboard') — surtout ne pas mettre "/dashboard" ici, la
# route n'existe pas et RouterView reste vide (seule la sidebar s'affiche).
export.url-tableau-de-bord=${EXPORT_URL_TABLEAU_DE_BORD:http://localhost:5173/}
# Chemin (absolu ou relatif au repertoire de travail du process backend) du
# script Node/Playwright. Par defaut, suppose que le backend est lance depuis
# le dossier backend/ (cas standard mvn/IntelliJ) : ../export/export-dashboard.mjs.
# A adapter via la variable d'environnement si le repertoire de travail differe.
export.chemin-script=${EXPORT_CHEMIN_SCRIPT:../export/export-dashboard.mjs}
