spring.application.name=homebank

# --- Base de donnees PostgreSQL ---
# Adapte l'URL, l'utilisateur et le mot de passe a ton environnement,
# ou surcharge-les via variables d'environnement (voir README).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homebank}
spring.datasource.username=${DB_USER:homebank}
spring.datasource.password=${DB_PASSWORD:homebank}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' cree/adapte automatiquement le schema au demarrage (pratique en dev).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Logs ---
# Niveau INFO par defaut sur tout le code applicatif ; les erreurs 500
# (voir GlobalExceptionHandler) sont loggees avec leur stacktrace complete
# en niveau ERROR, donc toujours visibles meme sans toucher a cette config.
logging.level.com.homebank=INFO
# Repasser a DEBUG temporairement si besoin de voir le detail des requetes SQL
# fautives lors du diagnostic d'une 500 :
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE


# --- Upload de fichiers (import CSV/QIF) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080
