<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeBank</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Polices chargées sans bloquer le premier affichage : l'appli reste immédiate si le réseau est lent ou coupé. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Sora:wght@500..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <!-- Applique le thème choisi avant le premier affichage (évite un flash de l'autre thème) ; voir src/services/theme.js.
         Clair par défaut ; « system » (choix explicite) laisse le système décider. -->
    <script>
        var theme = 'light';
        try { theme = localStorage.getItem('homebank-theme') || 'light'; } catch (e) { /* stockage indisponible : clair */ }
        if (theme !== 'system') document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
